<!doctype html>
<html lang="es-UY">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- El mismo icono del sitio y del panel. Sin esto el navegador pide
         /favicon.ico, no lo encuentra, y la app queda con el icono por defecto. -->

    <meta name="robots" content="noindex, nofollow" />
    <!-- Igual que la barra de arriba de la app: al instalarla, la barra de estado
         del teléfono se funde con el encabezado en vez de cortarlo. -->
    <meta name="theme-color" content="#0b0b0d" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Mis clases · Academia Gimenoos</title>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
