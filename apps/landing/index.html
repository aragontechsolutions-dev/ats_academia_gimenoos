<!doctype html>
<html lang="es-UY">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Academia de Choferes Gimenoos | Clases de manejo en San Carlos, Maldonado</title>
    <meta
      name="description"
      content="Academia de choferes en San Carlos, Maldonado. Clases prácticas de moto y auto con instructores habilitados y acompañamiento del trámite de la libreta de conducir."
    />
    <link rel="canonical" href="https://www.academiagimenoos.com.uy/" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#1d4ed8" />

    <!-- Open Graph: como se ve el enlace al compartirlo por WhatsApp o redes -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_UY" />
    <meta property="og:site_name" content="Academia de Choferes Gimenoos" />
    <meta property="og:title" content="Academia de Choferes Gimenoos | San Carlos, Maldonado" />
    <meta
      property="og:description"
      content="Clases de manejo de moto y auto en San Carlos. Reservá tu clase online."
    />
    <meta property="og:url" content="https://www.academiagimenoos.com.uy/" />
    <!-- TODO(datos-reales): subir una imagen 1200x630 a /public y referenciarla aca. -->

    <!--
      Datos estructurados schema.org.
      Le dicen a Google que esto es una autoescuela local y ayudan al SEO local.
      TODO(datos-reales): completar telephone, address, geo y openingHours con los
      datos reales. Los campos incompletos deben eliminarse, no dejarse con valores
      de ejemplo: Google penaliza los datos estructurados que no coinciden con la
      informacion visible en la pagina.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "DrivingSchool",
        "name": "Academia de Choferes Gimenoos",
        "description": "Academia de choferes en San Carlos, Maldonado, Uruguay. Clases de manejo de moto y auto.",
        "url": "https://www.academiagimenoos.com.uy/",
        "areaServed": [
          { "@type": "City", "name": "San Carlos" },
          { "@type": "AdministrativeArea", "name": "Maldonado" }
        ],
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "San Carlos",
          "addressRegion": "Maldonado",
          "addressCountry": "UY"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
